<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">BTC perpetual scalping v2 proposed chart layout</title>
  <desc id="desc">Illustrative layout with fictional candles, a persistent long setup marker, labeled entry stop and target, and a status panel showing a pending simulated entry. No performance claim.</desc>
  <defs>
    <pattern id="grid" width="100" height="80" patternUnits="userSpaceOnUse"><path d="M 100 0 L 0 0 0 80" fill="none" stroke="#202b38" stroke-width="1"/></pattern>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; }
      .small { font-size: 13px; fill: #aab9c9; }
      .label { font-size: 15px; font-weight: 600; }
      .up { fill: #39caa7; stroke: #39caa7; }
      .down { fill: #ed7b8a; stroke: #ed7b8a; }
    </style>
  </defs>
  <rect width="1200" height="720" rx="16" fill="#0e151f"/>
  <rect x="0" y="0" width="1200" height="80" rx="16" fill="#151f2d"/>
  <text x="30" y="33" font-size="21" font-weight="700" fill="#edf4fc">BTC/USDT.P</text>
  <text x="204" y="33" font-size="15" fill="#afc1d4">5m entries / completed 15m trend</text>
  <rect x="855" y="18" width="313" height="29" rx="6" fill="#283549"/>
  <text x="873" y="38" font-size="12" font-weight="700" fill="#c6d6e8">DESIGN PROPOSAL · FICTIONAL PRICES</text>
  <text x="30" y="60" class="small">Scalp v2 · one setup, named levels, explicit status</text>
  <rect x="28" y="100" width="816" height="507" rx="8" fill="#101a26"/>
  <rect x="28" y="100" width="816" height="507" rx="8" fill="url(#grid)"/>

  <!-- Subordinate context lines; the trade levels have greater visual weight. -->
  <path d="M 40 545 C 130 535 180 510 240 503 S 350 485 410 449 S 470 415 525 402" fill="none" stroke="#70b6f1" stroke-width="1.5" opacity="0.65"/>
  <path d="M 40 565 C 140 552 205 540 270 528 S 400 490 525 453" fill="none" stroke="#d7ad6e" stroke-width="1.5" opacity="0.65"/>
  <text x="46" y="124" class="small">EMA 20 / 50 · optional context</text>

  <!-- Fictional candles, only to communicate layout. -->
  <g stroke-width="2">
    <path d="M70 519V576" class="up"/><rect x="64" y="535" width="12" height="24" class="up"/>
    <path d="M100 500V553" class="up"/><rect x="94" y="515" width="12" height="25" class="up"/>
    <path d="M130 505V550" class="down"/><rect x="124" y="520" width="12" height="18" class="down"/>
    <path d="M160 478V540" class="up"/><rect x="154" y="490" width="12" height="35" class="up"/>
    <path d="M190 449V510" class="up"/><rect x="184" y="462" width="12" height="31" class="up"/>
    <path d="M220 458V512" class="down"/><rect x="214" y="471" width="12" height="25" class="down"/>
    <path d="M250 477V529" class="down"/><rect x="244" y="490" width="12" height="25" class="down"/>
    <path d="M280 475V524" class="up"/><rect x="274" y="489" width="12" height="23" class="up"/>
    <path d="M310 444V500" class="up"/><rect x="304" y="457" width="12" height="33" class="up"/>
    <path d="M340 407V469" class="up"/><rect x="334" y="419" width="12" height="34" class="up"/>
    <path d="M370 392V446" class="up"/><rect x="364" y="404" width="12" height="23" class="up"/>
    <path d="M400 398V454" class="down"/><rect x="394" y="413" width="12" height="24" class="down"/>
    <path d="M430 420V473" class="down"/><rect x="424" y="433" width="12" height="23" class="down"/>
    <path d="M460 431V476" class="up"/><rect x="454" y="442" width="12" height="18" class="up"/>
    <path d="M490 399V452" class="up"/><rect x="484" y="411" width="12" height="32" class="up"/>
    <path d="M520 369V424" class="up"/><rect x="514" y="388" width="12" height="24" class="up"/>
  </g>

  <!-- Pending setup: dashed boundaries and muted shading, not a filled-position claim. -->
  <rect x="540" y="180" width="258" height="210" fill="#2bc79a" opacity="0.08"/>
  <rect x="540" y="390" width="258" height="140" fill="#f07887" opacity="0.09"/>
  <path d="M540 180H798" fill="none" stroke="#49d4ac" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M540 390H798" fill="none" stroke="#f3d17e" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M540 530H798" fill="none" stroke="#f28c99" stroke-width="2" stroke-dasharray="8 5"/>
  <path d="M540 162V550" fill="none" stroke="#8395a9" stroke-width="1" stroke-dasharray="3 6" opacity="0.6"/>
  <text x="603" y="167" class="label" fill="#68dfbd">TP 81,975 · 1.50R</text>
  <text x="612" y="378" class="label" fill="#f3d17e">ENTRY REF 81,000</text>
  <text x="596" y="553" class="label" fill="#f79eaa">SL 80,350 · 0.80%</text>
  <text x="590" y="285" class="small">Proposed reward</text>
  <text x="601" y="466" class="small">Proposed risk</text>
  <rect x="475" y="475" width="90" height="30" rx="6" fill="#203d35" stroke="#50caa5"/>
  <text x="494" y="496" class="label" fill="#8be4c6">LONG</text>
  <text x="464" y="523" class="small">Confirmed setup</text>

  <!-- A single, bounded status panel. -->
  <rect x="866" y="100" width="304" height="507" rx="10" fill="#182332" stroke="#2c3b4f"/>
  <text x="887" y="132" class="label" fill="#edf4fc">SETUP STATUS</text>
  <rect x="886" y="149" width="264" height="38" rx="6" fill="#3c3322"/>
  <text x="903" y="174" font-size="14" font-weight="700" fill="#f3d17e">LONG · AWAITING FILL</text>
  <text x="887" y="216" class="small">Profile</text><text x="1050" y="216" font-size="14" fill="#edf4fc">5m / 15m</text>
  <text x="887" y="249" class="small">Completed trend</text><text x="1094" y="249" font-size="14" fill="#68dfbd">LONG</text>
  <text x="887" y="282" class="small">Entry type</text><text x="1033" y="282" font-size="14" fill="#edf4fc">Bounded limit</text>
  <path d="M887 300H1148" stroke="#304055"/>
  <text x="887" y="329" class="small">Cost assumption</text><text x="1095" y="329" font-size="14" fill="#edf4fc">15 bps</text>
  <text x="887" y="362" class="small">Estimated cost / R</text><text x="1101" y="362" font-size="14" fill="#edf4fc">0.19R</text>
  <text x="887" y="395" class="small">Entry validity</text><text x="1083" y="395" font-size="14" fill="#edf4fc">Next bar</text>
  <path d="M887 415H1148" stroke="#304055"/>
  <text x="887" y="444" class="small">Mode</text><text x="1076" y="444" font-size="14" fill="#b7c8df">RESEARCH</text>
  <text x="887" y="478" font-size="13" fill="#b7c8df">Standalone chart: modeled state.</text>
  <text x="887" y="499" font-size="13" fill="#b7c8df">A setup is not a confirmed fill.</text>
  <rect x="886" y="533" width="264" height="46" rx="6" fill="#111b28"/>
  <text x="899" y="552" font-size="12" fill="#8fa4bd">When blocked, replace this panel's state</text>
  <text x="899" y="569" font-size="12" fill="#8fa4bd">with the main reason, e.g. COST TOO HIGH.</text>

  <text x="36" y="637" font-size="14" font-weight="600" fill="#d3dfed">Stable signal</text>
  <text x="240" y="637" font-size="14" font-weight="600" fill="#d3dfed">Named entry / SL / TP</text>
  <text x="530" y="637" font-size="14" font-weight="600" fill="#d3dfed">Visible expiry and outcome</text>
  <text x="866" y="637" font-size="14" font-weight="600" fill="#d3dfed">One status panel</text>
  <text x="36" y="681" font-size="13" fill="#8c9eb4">ILLUSTRATIVE ONLY · Fictional prices and candles · No measured win rate or profitability implied · Not yet implemented</text>
</svg>
